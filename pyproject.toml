[project]
name = "leech"
version = "0.0.1"
description = "Leech compiler"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lark[interegular]>=1.3.1",
    "llvmlite>=0.47.0",
    "more-itertools>=11.1.0",
    "networkx[default]>=3.6.1",
    "rich>=15.0.0",
]

[project.scripts]
leech = "leech:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "coverage>=7.14.0",
    "pytest>=9.0.3",
    "reuse>=6.2.0",
    "ruff>=0.16.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
# Markdown plans contain Python fragments at their intended surrounding
# indentation; formatting them as standalone modules destroys that context.
exclude = ["docs/**/*.md"]

[tool.ruff.lint]
# UP045 (Optional[X] -> X | None) is disabled: this codebase prefers
# `Optional[X]` over PEP 604 syntax for nullable types.
ignore = ["UP045"]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes (default set, kept explicit)
    "A",             # flake8-builtins: don't shadow builtins
    "B",             # flake8-bugbear: likely bugs and design issues
    "C4",            # flake8-comprehensions
    "I",             # isort
    "N",             # pep8-naming
    "PIE",           # misc lint rules
    "PLC", "PLE", "PLW",  # pylint checks ported to ruff (excl. PLR: complexity/refactor, too noisy for now)
    "PTH",           # prefer pathlib over os.path
    "RET",           # return/else simplifications
    "RUF",           # ruff-specific checks
    "SIM",           # flake8-simplify
    "T20",           # no stray print()
    "UP",            # pyupgrade, enforced against target-version
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"src/leech/driver.py" = ["T20"]
"src/leech/errors.py" = ["T20"]
